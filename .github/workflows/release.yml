name: Release

# Tag a commit with v* (e.g. v0.9.0) to build and publish a release.
# The release is created as a DRAFT — review the artifacts, then publish by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    # ZYNLEX is Windows-only (WebView2 COM APIs) — see docs/architecture.md.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Fail fast before the slow Rust release build.
      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and emits latest.json. Without these the
          # build still succeeds but ships no update manifest, so installed
          # copies would never see the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ZYNLEX ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/webtools-dotcom/Zynlex/blob/main/CHANGELOG.md) for what's in this release.

            **Requirements:** Windows 10 or 11. The installer adds the WebView2 runtime if it's missing.
          releaseDraft: true
          prerelease: false

      # Releases aren't code-signed yet (CODE_SIGNING_POLICY.md), so each one lists
      # its installers' SHA-256, for anyone checking a download against this build.
      - name: Add installer checksums to the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *-setup.exe, *.msi
          $rows = $files | ForEach-Object { "| ``$($_.Name)`` | ``$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())`` |" }
          $body = gh release view "${{ github.ref_name }}" --json body --jq .body
          $body += "`n`n### SHA-256`n`n| File | SHA-256 |`n|---|---|`n" + ($rows -join "`n")
          $body | gh release edit "${{ github.ref_name }}" --notes-file -
